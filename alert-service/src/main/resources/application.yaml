server:
  port: 8082

spring:
  application:
    name: notification-service
  cloud:
    discovery:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092 # Ensure this is explicitly defined
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Using ErrorHandlingDeserializer is a great choice to prevent "Poison Pill" loops
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Update this to the actual package path in THIS service
        spring.json.value.default.type: "com.example.alert_service.model.Transaction"
        # Trust your own package and any common model packages
        spring.json.trusted.packages: "com.example.*"
        # Set to false if the producer is not a Spring app or uses different headers
        spring.json.use.type.headers: false
eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true